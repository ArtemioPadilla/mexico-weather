name: CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Stories 18.1 / 18.2 — the NHC KMZ → GeoJSON parser has its own
      # dependency-free self-test (python3 ships on ubuntu-latest).
      - run: python3 scripts/nhc_kml.py --selftest
        env:
          # Complete the incomplete SMN TLS chain (see src/data/smn-ca.pem)
          # so the RSS endpoint fetches real avisos; TLS stays verified.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/src/data/smn-ca.pem
